<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" preserveAspectRatio="none">
  <!-- Aged parchment, original procedural texture (for later reading pages) -->
  <defs>
    <radialGradient id="pch" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#e6d9bd"/>
      <stop offset="0.7" stop-color="#ddcca2"/>
      <stop offset="1" stop-color="#cdbb8c"/>
    </radialGradient>
    <filter id="fibre" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.3  0 0 0 0 0.24  0 0 0 0 0.13  0 0 0 0.08 0"/>
    </filter>
    <filter id="stain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="17" result="n2"/>
      <feColorMatrix in="n2" type="matrix"
        values="0 0 0 0 0.42  0 0 0 0 0.32  0 0 0 0 0.16  0 0 0 0.22 0"/>
    </filter>
  </defs>
  <rect width="600" height="800" fill="url(#pch)"/>
  <rect width="600" height="800" filter="url(#stain)" opacity="0.6"/>
  <rect width="600" height="800" filter="url(#fibre)" opacity="0.5"/>
</svg>
